name: Coin Reference Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  reference-tests:
    name: Run coin scanner regression tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run stable regression tests
        run: |
          node --test tests/core.test.mjs tests/reference.test.mjs tests/europe-batch01.test.mjs tests/europe-batch02.test.mjs tests/europe-batch03.test.mjs tests/europe-depth.test.mjs tests/world-batch04.test.mjs tests/world-batch05-asia.test.mjs tests/world-batch15-top-collector-series.test.mjs tests/world-chain-current.test.mjs

      - name: Verify intermediate world modules load
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const pairs=[
            ['coin-world06-oceania.js','coin-world05-asia.js'],
            ['coin-world07-latam-caribbean.js','coin-world06-oceania.js'],
            ['coin-world08-africa.js','coin-world07-latam-caribbean.js'],
            ['coin-world09-issuers-territories.js','coin-world08-africa.js'],
            ['coin-world10-historical-issuers.js','coin-world09-issuers-territories.js'],
            ['coin-world11-historical-series.js','coin-world10-historical.js'],
            ['coin-world12-historical-series.js','coin-world11-historical-series.js'],
            ['coin-world13-historical-series.js','coin-world12-historical-series.js'],
            ['coin-world14-historical-series.js','coin-world13-historical-series.js'],
            ['coin-world15-top-collector-series.js','coin-world14-historical-series.js']
          ];
          for(const [child,parent] of pairs){const text=fs.readFileSync(`beta/${child}`,'utf8');if(!text.includes(parent))throw new Error(`${child} does not chain ${parent}`)}
          console.log(`Verified ${pairs.length} world-chain links`);
          NODE
