name: Coin Reference Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  reference-tests:
    name: Run coin scanner regression tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run regression tests
        run: |
          node --test tests/core.test.mjs tests/reference.test.mjs tests/europe-batch01.test.mjs tests/europe-batch02.test.mjs tests/europe-batch03.test.mjs tests/europe-coverage.test.mjs tests/europe-depth.test.mjs tests/world-batch04.test.mjs tests/world-batch05-asia.test.mjs tests/world-batch06-oceania.test.mjs tests/world-batch07-latam-caribbean.test.mjs
