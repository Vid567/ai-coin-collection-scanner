name: Coin Reference Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  reference-tests:
    name: Run coin scanner regression tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install real-photo benchmark dependencies
        run: pip install pillow numpy

      - name: Run stable regression tests
        run: |
          node --test tests/core.test.mjs tests/reference.test.mjs tests/detection-quality.test.mjs tests/quality.test.mjs tests/ocr-quality.test.mjs tests/photo-benchmark.test.mjs tests/europe-batch01.test.mjs tests/europe-batch02.test.mjs tests/europe-batch03.test.mjs tests/europe-depth.test.mjs tests/world-batch04.test.mjs tests/world-batch05-asia.test.mjs tests/world-batch15-top-collector-series.test.mjs tests/world-batch16-high-value-collector.test.mjs tests/world-batch17-key-dates-variants.test.mjs tests/world-batch18-historical-key-dates.test.mjs tests/world-batch19-final-gap-closer.test.mjs tests/world-chain-current.test.mjs

      - name: Report real-photo benchmark readiness
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import {aggregateBenchmark,evaluateThresholds} from './beta/benchmark/photo-benchmark-core.mjs';
          const manifest=JSON.parse(fs.readFileSync('./beta/benchmark/real-photo-manifest.json','utf8'));
          const report=aggregateBenchmark(manifest.cases),gate=evaluateThresholds(report,manifest.thresholds);
          console.log(JSON.stringify({report,gate},null,2));
          if(gate.passed===false)process.exit(1);
          NODE

      - name: Run real-photo detector baseline
        run: python scripts/real_photo_detector_smoke.py

      - name: Verify frozen world module chain
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const pairs=[
            ['coin-world06-oceania.js','coin-world05-asia.js'],['coin-world07-latam-caribbean.js','coin-world06-oceania.js'],['coin-world08-africa.js','coin-world07-latam-caribbean.js'],['coin-world09-issuers-territories.js','coin-world08-africa.js'],['coin-world10-historical-issuers.js','coin-world09-issuers-territories.js'],['coin-world11-historical-series.js','coin-world10-historical-issuers.js'],['coin-world12-historical-series.js','coin-world11-historical-series.js'],['coin-world13-historical-series.js','coin-world12-historical-series.js'],['coin-world14-historical-series.js','coin-world13-historical-series.js'],['coin-world15-top-collector-series.js','coin-world14-historical-series.js'],['coin-world16-high-value-collector-depth.js','coin-world15-top-collector-series.js'],['coin-world17-key-dates-variants.js','coin-world16-high-value-collector-depth.js'],['coin-world18-historical-key-dates.js','coin-world17-key-dates-variants.js'],['coin-world19-final-gap-closer.js','coin-world18-historical-key-dates.js']
          ];for(const [child,parent] of pairs){const text=fs.readFileSync(`beta/${child}`,'utf8');if(!text.includes(parent))throw new Error(`${child} does not chain ${parent}`)}console.log(`Verified frozen ${pairs.length}-link world chain`);
          NODE
