<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Coin Collection Scanner — Content Creator</title><style>body{font-family:system-ui,sans-serif;max-width:980px;margin:32px auto;padding:0 16px;background:#f6f7f9;color:#171717}h1{margin-bottom:4px}.note{color:#555}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button{padding:9px 13px;border:1px solid #bbb;border-radius:8px;background:white;cursor:pointer}.post{background:white;border:1px solid #ddd;border-radius:12px;padding:16px;margin:12px 0}.meta{font-size:13px;color:#666;margin-bottom:8px}.text{white-space:pre-wrap}.count{font-size:12px;color:#666;margin-top:8px}.over{color:#b00020;font-weight:700}</style></head><body><h1>AI Coin Collection Scanner</h1><p class="note">English master content library — Browser Beta. 50 Threads-ready posts. Product claims stay within current Beta scope.</p><div class="toolbar"><button onclick="copyAll()">Copy all</button><button onclick="downloadCsv()">Download CSV</button></div><div id="posts"></div><script>
const URL='https://github.com/Vid567/ai-coin-collection-scanner';
const raw=[
['Organize','A coin collection can grow faster than your notes can keep up.\n\nAI Coin Collection Scanner helps turn collection photos into a structured inventory you can review and export.'],
['Organize','Boxes, trays, albums, loose coins — collections rarely start with a perfect spreadsheet.\n\nStart with photos and build a clearer coin inventory step by step.'],
['Organize','The useful first step is not guessing what every coin is worth. It is knowing what you actually have.\n\nBuild a structured inventory from your collection photos.'],
['Organize','A searchable coin inventory is easier to work with than hundreds of unnamed photos.\n\nUse the Browser Beta to turn photos into organized records.'],
['Organize','Inherited a coin collection and do not know where to begin?\n\nStart by documenting it. A structured inventory gives you a practical overview before deeper research.'],
['Organize','You do not need to research every coin before you start organizing.\n\nInventory first. Research interesting records afterwards.'],
['Organize','One photo folder is not the same as a coin inventory.\n\nCreate records you can review, edit and save to Excel or CSV.'],
['Organize','A collection becomes easier to manage when each coin has a place in an inventory.\n\nThe Browser Beta is designed to help with that first practical step.'],
['Organize','Coin collecting creates information: country, denomination, year, photos, notes and research leads.\n\nKeep that information together in a structured inventory.'],
['Organize','Before adding more coins, it can help to understand the collection you already own.\n\nTurn your photos into an inventory you can continue improving.'],
['Photos','Photographing several coins at once? Keep them in the same positions when you turn them over.\n\nThat makes front and reverse photos much easier to match.'],
['Photos','Simple photo habit: number your coin photos as you work.\n\nIt makes later checking and matching much easier, especially with larger collections.'],
['Photos','For grouped coin photos, position matters.\n\nKeep the layout unchanged between the front and reverse shot so the two sides can be paired more reliably.'],
['Photos','Clear photos make a better starting point for coin research.\n\nUse even light, avoid heavy reflections and keep important details visible.'],
['Photos','Do not pile coins on top of each other for an inventory photo.\n\nVisible edges, dates and designs give you much more useful records to work with.'],
['Photos','A consistent photo routine saves work later.\n\nFront photo → keep positions → turn coins → reverse photo → continue with the next group.'],
['Photos','Large collection? Work in manageable photo groups instead of trying to document everything at once.\n\nA repeatable process beats a perfect one-day project.'],
['Photos','If a coin is worth researching further, better photos help.\n\nCapture enough detail to compare it later with qualified public reference sources.'],
['Photos','Your camera roll can become part of a useful collecting workflow.\n\nPhotograph, organize, review and export instead of leaving the images unnamed.'],
['Photos','Good matching starts when the photo is taken.\n\nFor multiple coins, keep every coin in the same position between front and reverse images.'],
['Research','Not every coin needs the same amount of research.\n\nThe Browser Beta can help you mark records that deserve a closer look.'],
['Research','Interesting coin? Treat the inventory as a research starting point, not a valuation certificate.\n\nCheck promising records against qualified public sources.'],
['Research','Coin identification can require details that a single photo does not show.\n\nUse the Beta to organize observations and decide what deserves further research.'],
['Research','A research-priority label is useful because your time is limited.\n\nFocus deeper checking on the coins that actually raise questions.'],
['Research','Country, denomination and year can point you toward better reference sources.\n\nA structured record makes that follow-up research easier.'],
['Research','The Browser Beta does not promise rarity or value.\n\nIt helps create an inventory and flag records that may be worth investigating further.'],
['Research','Good collecting software should separate facts from guesses.\n\nRecord what you can see, then use reliable sources for deeper identification and research.'],
['Research','Sometimes the best result is not an instant answer.\n\nIt is a well-organized record that tells you exactly what still needs checking.'],

function compose(p,i){const availability='🌍 English version available now.';const cta='Try the Browser Beta 👇';let text=`${p[1]}\n\n${availability}\n\n${cta}\n${URL}\n\nDM me with your feedback.`;if(text.length>500)text=`${p[1]}\n\n${availability}\n\n${cta}\n${URL}`;return text}
const posts=raw.map((p,i)=>({id:`COIN-${String(i+1).padStart(3,'0')}`,theme:p[0],text:compose(p,i)}));
const root=document.getElementById('posts');posts.forEach(p=>{const el=document.createElement('article');el.className='post';el.innerHTML=`<div class="meta">${p.id} · ${p.theme}</div><div class="text"></div><div class="count ${p.text.length>500?'over':''}">${p.text.length}/500</div><button>Copy</button>`;el.querySelector('.text').textContent=p.text;el.querySelector('button').onclick=()=>navigator.clipboard.writeText(p.text);root.appendChild(el)});
function copyAll(){navigator.clipboard.writeText(posts.map(p=>`${p.id}\n${p.text}`).join('\n\n---\n\n'))}
function downloadCsv(){const q=v=>'"'+String(v).replaceAll('"','""')+'"';const csv='\ufeff'+[['id','theme','text'],...posts.map(p=>[p.id,p.theme,p.text])].map(r=>r.map(q).join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='ai-coin-content-en.csv';a.click()}
if(posts.length!==50||posts.some(p=>p.text.length>500))throw new Error('Content QA failed');
</script></body></html>
