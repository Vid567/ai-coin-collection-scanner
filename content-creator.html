<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Coin Scanner — Content Creator</title><script async src="https://www.googletagmanager.com/gtag/js?id=G-S4QMB08LJM"></script><script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-S4QMB08LJM');</script><style>body{font:16px/1.55 system-ui;margin:0;background:#f7f9fc;color:#172033}.wrap{max-width:1080px;margin:auto;padding:22px}.top{background:#14365e;color:#fff;padding:25px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}select,input,button{font:inherit;padding:10px;border:1px solid #d8e2ec;border-radius:9px;background:#fff}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:#fff;border:1px solid #d8e2ec;border-radius:14px;padding:17px}.meta{display:flex;justify-content:space-between;color:#5d6977;font-size:.85rem}.post{white-space:pre-wrap;margin:12px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{min-height:40px;border-radius:8px;border:1px solid #d8e2ec;padding:8px 10px}.copy{background:#245c91;color:#fff;font-weight:800}.processed{border-color:#176b45;box-shadow:0 0 0 2px #d1fae5}.processed .processed-btn{background:#176b45;color:#fff}.progress{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 18px}.progress strong{background:#e7f2f8;color:#14365e;padding:8px 11px;border-radius:9px;font-size:13px}.planner{background:#fff;border:1px solid #d8e2ec;border-radius:14px;padding:17px;margin:18px 0 50px}.planner-row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #d8e2ec}@media(max-width:760px){.cards{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="wrap"><h1>🪙 AI Coin Scanner Content Creator</h1><p>25 English posts for collectors, curious beginners and inherited collections.</p></div></header><main class="wrap"><div class="toolbar"><select id="channel"><option value="bsky">Bluesky</option><option value="threads">Threads</option></select><input id="search" type="search" placeholder="Search posts"></div><div class="progress"><strong id="processedCount"></strong><strong id="nextPost"></strong></div><section id="cards" class="cards"></section><section class="planner"><h2>Planner</h2><div id="planner"></div></section></main><script>const LINKS={bsky:'https://vid567.github.io/apps/?product=coin',threads:'https://vid567.github.io/apps/?product=coin'};const raw=[['Inherited a box of coins and not sure what is in it?','Start with an overview. Clear photos can become an editable inventory you can review before deeper research.'],['You do not need to know every ruler, mint or denomination before you begin.','Organize the collection first. Research the interesting coins next.'],['A coin collection becomes easier to explore when the pieces are no longer just loose photos, trays and boxes.','Build one clearer inventory.'],['Collected coins while travelling?','Turn those mixed countries and currencies into records you can review and organize.'],['Received a family coin collection?','A first inventory can show you what is there before you decide what needs specialist research.'],['Old coins, modern coins, world coins: start by getting them into one structured overview.',''],['A folder of coin photos is a start.','An editable inventory makes those photos much easier to revisit and organize.'],['AI should help with the first pass, not pretend to be the final numismatic authority.','Review suggestions and keep control of your records.'],['The scanner is designed to help organize and research a collection.','It does not guarantee identification, authenticity, rarity or value.'],['Front and reverse both matter.','Keeping both sides connected gives you a better record for later research.'],['Not every coin needs hours of research.','A clear inventory helps you decide which pieces deserve a closer look.'],['A useful first result is not always a perfect identification.','Sometimes the best next step is simply a good record marked for further research.'],['Use AI suggestions as clues.','Confirm important details with reliable numismatic references when exact identification matters.'],['Coin photo tip: use even light and avoid strong reflections.','Metal surfaces can hide useful details when glare takes over the image.'],['Coin photo tip: photograph the coin reasonably straight from above and keep the full edge visible.',''],['Photograph both sides when you can.','The obverse and reverse together often provide much more useful information.'],['Mixed box of coins? Start with a small batch.','Create the inventory, review it and continue with the next group.'],['Keep your original coin photos.','They are useful when you want to revisit a date, mint mark, inscription or design detail.'],['Use the inventory to organize first.','Then spend research time on the coins that actually interest you.'],['If a suggested detail looks uncertain, edit it or leave it open.','An honest unknown is more useful than a confident wrong answer.'],['Coin collectors: what takes the most time in your collection today?','Identification, inventory, photographing coins or researching individual pieces?'],['If you inherited coins, what did you want to know first?','What was there, where it came from, whether anything was unusual, or how to organize it?'],['What would make a digital coin inventory more useful to you: better photo handling, easier editing, research links or richer exports?',''],['I am testing AI Coin Collection Scanner with international coins from different periods.','The goal is a useful first inventory, not exaggerated AI promises.'],['Have a few interesting coins or an entire inherited collection?','Try the Free Browser Beta and tell me which part of the workflow should improve next.']];let plan=JSON.parse(localStorage.getItem('coinContentPlan')||'{}');let processed=JSON.parse(localStorage.getItem('coinContentProcessedV1')||'{}');function getPosts(){return raw.map((p,i)=>({id:`COIN-${String(i+1).padStart(3,'0')}`,text:`${p[0]}${p[1]?`\n\n${p[1]}`:''}\n\n🌍 Free Browser Beta\n${LINKS[channel.value]}\n\nDM me with your feedback.`}))}function render(){const q=search.value.toLowerCase();cards.innerHTML='';getPosts().filter(p=>p.text.toLowerCase().includes(q)).forEach(p=>{const e=document.createElement('article');e.className=`card ${processed[p.id]?'processed':''}`;e.innerHTML=`<div class="meta"><b>${p.id}</b><span>${channel.options[channel.selectedIndex].text}</span></div><div class="post"></div><div class="actions"><button class="copy">Copy</button><button class="plan">${plan[p.id]?'Change time':'Plan'}</button>${processed[p.id]?'<button class="processed-btn">✓ Processed</button>':''}</div>`;e.querySelector('.post').textContent=p.text;e.querySelector('.copy').onclick=async()=>{await navigator.clipboard.writeText(p.text);if(!processed[p.id]){processed[p.id]=new Date().toISOString();localStorage.setItem('coinContentProcessedV1',JSON.stringify(processed));render()}};e.querySelector('.plan').onclick=()=>planOne(p.id);const processedButton=e.querySelector('.processed-btn');if(processedButton)processedButton.onclick=()=>toggleProcessed(p.id);cards.appendChild(e)});renderProgress();renderPlanner()}function planOne(id){const value=prompt('Enter date and time (YYYY-MM-DD HH:MM)',plan[id]||'');if(!value)return;plan[id]=value;localStorage.setItem('coinContentPlan',JSON.stringify(plan));render()}function toggleProcessed(id){if(processed[id])delete processed[id];else processed[id]=new Date().toISOString();localStorage.setItem('coinContentProcessedV1',JSON.stringify(processed));render()}function renderProgress(){const list=getPosts(),done=list.filter(p=>processed[p.id]);processedCount.textContent=`${done.length} of ${list.length} processed`;const next=list.find(p=>!processed[p.id]);nextPost.textContent=next?`Next: ${next.id}`:'All posts processed ✓'}function renderPlanner(){const list=getPosts().filter(p=>plan[p.id]).sort((a,b)=>plan[a.id].localeCompare(plan[b.id]));planner.innerHTML=list.length?list.map(p=>`<div class="planner-row"><span>${plan[p.id]}</span><strong>${p.id}</strong></div>`).join(''):'No posts planned yet.'}channel.onchange=render;search.oninput=render;render();</script></body></html>
