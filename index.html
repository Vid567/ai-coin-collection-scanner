<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Coin Collection Scanner — Choose language</title><meta name="description" content="Choose your language for AI Coin Collection Scanner."><meta name="theme-color" content="#14365e"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#14365e,#245c91);color:white;font:17px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{width:min(900px,calc(100% - 32px));text-align:center;padding:50px 0}.brand{margin-bottom:30px;font-size:1.1rem}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.choice{background:white;color:#14365e;text-decoration:none;border-radius:18px;padding:28px 20px;text-align:left;box-shadow:0 15px 35px rgba(0,0,0,.12)}.choice .prompt{display:block;font-size:clamp(1.5rem,3vw,2.15rem);line-height:1.1;font-weight:900;margin:6px 0 22px}.choice strong{display:block;font-size:1.45rem;margin-bottom:5px}.flag{font-size:2rem;display:block;margin-bottom:10px}.choice .continue{color:#596775}@media(max-width:600px){.choices{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="brand">AI Coin Collection Scanner</div><div class="choices"><a class="choice" href="en/"><span class="prompt">Choose your language</span><span class="flag">🇬🇧</span><strong>English</strong><span class="continue">Continue in English</span></a><a class="choice" href="nl/"><span class="prompt">Kies je taal</span><span class="flag">🇳🇱</span><strong>Nederlands</strong><span class="continue">Ga verder in het Nederlands</span></a></div></main></body></html>
